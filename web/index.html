<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0f13" media="(prefers-color-scheme: dark)">
<meta name="referrer" content="no-referrer">
<title>文件传输助手</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="bg"></div>

<div id="app">
  <header class="topbar glass">
    <div class="brand"><img src="/icon.svg" alt=""><span>文件传输助手</span></div>
    <div class="tb-right">
      <button id="online" class="pill" type="button"><i class="dot" id="online-dot"></i><span id="online-text">连接中…</span></button>
      <button id="btn-qr" class="pill primary" type="button" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h3v3h-3zM20 14v.01M14 20v.01M17 20h4v-3"/></svg><span>手机扫码</span>
      </button>
      <button id="btn-menu" class="icon-btn" type="button" title="设置" aria-label="设置">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      </button>
    </div>
  </header>
  <div id="banner" class="banner" hidden></div>

  <main id="scroller">
    <div id="more" class="more" hidden><button type="button" id="btn-more">查看更早的消息</button></div>
    <div id="list"></div>
    <div id="empty" class="empty" hidden></div>
  </main>

  <div id="totals" class="totals glass" hidden></div>

  <footer class="composer glass">
    <div class="inner">
      <label class="icon-btn" for="pick-media" title="发送图片或视频" aria-label="发送图片或视频">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3.5"/><circle cx="9" cy="9.5" r="1.8"/><path d="M21 15.5l-4.6-4.6a1.5 1.5 0 0 0-2.1 0L5.5 19.8"/></svg>
      </label>
      <label class="icon-btn" for="pick-file" title="发送文件" aria-label="发送文件">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 11.5l-8.2 8.2a5 5 0 0 1-7.1-7.1l8.6-8.6a3.4 3.4 0 0 1 4.8 4.8l-8.6 8.6a1.7 1.7 0 0 1-2.4-2.4l7.9-7.9"/></svg>
      </label>
      <textarea id="input" rows="1" placeholder="输入文字，回车发送" enterkeyhint="send" autocomplete="off"></textarea>
      <button id="btn-send" class="send" type="button" disabled>发送</button>
    </div>
    <input type="file" id="pick-media" class="file-input" accept="image/*,video/*" multiple>
    <input type="file" id="pick-file" class="file-input" multiple>
  </footer>
</div>

<div id="drop" class="drop" hidden><div>松开鼠标，发送给所有设备</div></div>

<div id="viewer" class="viewer" hidden>
  <div class="v-top">
    <div class="v-title"><b id="v-name"></b><span id="v-sub"></span></div>
    <button class="icon-btn" type="button" id="v-close" title="关闭" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="v-stage" id="v-stage"></div>
  <div class="v-bottom" id="v-bottom"></div>
</div>

<div id="sheet" class="sheet-wrap" hidden><div class="sheet" id="sheet-body"></div></div>

<div id="login" class="login" hidden>
  <form class="login-card glass" id="login-form" autocomplete="off">
    <img src="/icon.svg" alt="">
    <h1>文件传输助手</h1>
    <p>输入电脑上显示的 6 位访问码<br>（用手机扫电脑上的二维码就不用输）</p>
    <input id="login-code" class="code-inp" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="······">
    <button class="btn primary" type="submit">进入</button>
    <div class="login-err" id="login-err"></div>
  </form>
</div>

<div id="toast" class="toast" hidden></div>
<script src="/app.js"></script>
</body>
</html>
